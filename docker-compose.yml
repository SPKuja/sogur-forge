services:
  init:
    image: alpine:3.22
    restart: "no"
    volumes:
      - secrets:/secrets
      - recovery:/recovery
    command: >-
      sh -ec 'umask 077;
      [ -s /secrets/postgres ] || head -c 48 /dev/urandom | od -An -tx1 | tr -d " \n" > /secrets/postgres;
      [ -s /secrets/auth ] || head -c 48 /dev/urandom | od -An -tx1 | tr -d " \n" > /secrets/auth;
      chmod 0400 /secrets/postgres /secrets/auth;
      printf "# Sögur Forge recovery secrets - keep private and offline.\nPOSTGRES_PASSWORD=%s\nAUTH_SECRET=%s\n" "$$(cat /secrets/postgres)" "$$(cat /secrets/auth)" > /recovery/sogur-forge-recovery.env;
      chmod 0400 /recovery/sogur-forge-recovery.env'

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: sogur_forge
      POSTGRES_USER: sogur_forge
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres
    volumes:
      - data:/var/lib/postgresql/data
      - secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sogur_forge -d sogur_forge"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/spkuja/sogur-forge:latest
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    volumes:
      - secrets:/run/secrets:ro
      - assets:/app/data/assets
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
      ONEDRIVE_CLIENT_ID: ${ONEDRIVE_CLIENT_ID:-}
      ONEDRIVE_CLIENT_SECRET: ${ONEDRIVE_CLIENT_SECRET:-}
    command: >-
      sh -ec 'export DATABASE_URL="postgresql://sogur_forge:$$(cat /run/secrets/postgres)@db:5432/sogur_forge";
      export AUTH_SECRET="$$(cat /run/secrets/auth)";
      ./node_modules/.bin/prisma migrate deploy;
      exec node server.js'
    ports:
      - "3000:3000"

volumes:
  data:
  secrets:
  recovery:
  assets:
