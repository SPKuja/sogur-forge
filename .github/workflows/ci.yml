name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        env:
          DATABASE_URL: postgresql://sogur_forge:test@localhost:5432/sogur_forge
          AUTH_SECRET: ci-only-secret-not-used-at-runtime
        run: npm run build
      - name: Build Docker image
        run: docker build -t sogur-forge:ci .
