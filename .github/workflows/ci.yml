name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          DATABASE_URL: postgresql://sogur_forge:test@localhost:5432/sogur_forge
          AUTH_SECRET: ci-only-secret-not-used-at-runtime
        run: npm run build

      - name: Build Docker image
        run: docker build -t sogur-forge:ci .

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Docker metadata
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sogur-forge
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Publish Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy Sögur Forge to Portainer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PORTAINER_SOGUR_WEBHOOK_URL: ${{ secrets.PORTAINER_SOGUR_WEBHOOK_URL }}
        run: |
          test -n "$PORTAINER_SOGUR_WEBHOOK_URL"
          curl --fail --show-error --silent             --retry 3             --retry-all-errors             --connect-timeout 10             --max-time 30             --request POST             "$PORTAINER_SOGUR_WEBHOOK_URL"
          echo "Portainer redeploy triggered successfully."
